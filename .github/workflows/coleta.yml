name: Coleta de dados

on:
  schedule:
    - cron: "17 10 * * 1"   # segundas-feiras, 06:17 em MS (10:17 UTC)
  workflow_dispatch:
    inputs:
      pesquisas:
        description: "Pesquisas a coletar (ex.: pam ppm). Vazio = todas"
        required: false
        default: ""
      completo:
        description: "Baixar de novo todos os períodos"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  ibge:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Coletar IBGE
        run: python coleta/ibge.py ${{ inputs.pesquisas }} ${{ inputs.completo && '--completo' || '' }}
      - name: Gravar no repositório
        run: |
          git config user.name "coleta-automatica"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sem alterações nos dados."
          else
            git commit -m "Atualiza dados do IBGE ($(date -u +%Y-%m-%d))"
            git push
          fi
